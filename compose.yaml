services:
  db:
    image: postgres:17-alpine
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genegarden}
      POSTGRES_USER: ${POSTGRES_USER:-genegarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genegarden}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-genegarden}:${POSTGRES_PASSWORD:-genegarden}@db:5432/${POSTGRES_DB:-genegarden}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn genegarden_api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
